name: Release Linux

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag para build manual (ex: v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write  # mínimo necessário para criar Release; default do repo é read

# Só o dono pode disparar release (mantém open-source mas bloqueia fork/third-party)
# Push de tag já exige permissão de escrita (só você tem), mas o if garante que
# mesmo se alguém conseguir abrir workflow_dispatch, só felipebrgs1 executa.
concurrency:
  group: release-linux
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build Linux x64
    if: github.actor == 'felipebrgs1' || github.actor == github.repository_owner
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determinar versão
        id: version
        run: |
          if [ "${{ github.event.inputs.tag }}" != "" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # remove prefix v
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG -> Version: $VERSION"

      - name: Instalar dependências Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze || true

      - name: Build Linux Release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # extrai build-number do + se houver, senão usa github run_number
          BUILD_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VERSION" | cut -sd'+' -f2)
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          fi
          echo "Build: --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER"
          flutter build linux --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --verbose
          ls -lh build/linux/x64/release/bundle/

      - name: Empacotar tar.gz
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE="build/linux/x64/release/bundle"
          ARCH="x64"
          BASENAME="pdf-translate-${TAG}-linux-${ARCH}"
          # tarball do bundle
          tar -czf "${BASENAME}.tar.gz" -C "$BUNDLE" .
          # zip alternativo
          (cd "$BUNDLE" && zip -r "$GITHUB_WORKSPACE/${BASENAME}.zip" .)
          sha256sum "${BASENAME}.tar.gz" > "${BASENAME}.tar.gz.sha256"
          sha256sum "${BASENAME}.zip" > "${BASENAME}.zip.sha256"
          ls -lh "${BASENAME}".*
          echo "basename=${BASENAME}" >> $GITHUB_ENV
          # diretório para release
          mkdir -p dist
          mv "${BASENAME}.tar.gz" dist/
          mv "${BASENAME}.zip" dist/
          mv "${BASENAME}.tar.gz.sha256" dist/
          mv "${BASENAME}.zip.sha256" dist/

      - name: Gerar .deb (opcional, instalável)
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          DEB_VERSION=$(echo "${VERSION}" | sed 's/-/~/' )
          BASENAME="pdf-translate-${TAG}-linux-x64"
          BUNDLE="build/linux/x64/release/bundle"
          PKGDIR="pkg_deb/pdf-translate"
          mkdir -p "${PKGDIR}/opt/pdf-translate"
          mkdir -p "${PKGDIR}/usr/bin"
          mkdir -p "${PKGDIR}/usr/share/applications"
          mkdir -p "${PKGDIR}/usr/share/icons/hicolor/512x512/apps"
          mkdir -p "${PKGDIR}/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "${PKGDIR}/usr/share/pixmaps"
          cp -r "${BUNDLE}"/* "${PKGDIR}/opt/pdf-translate/"
          cat > "${PKGDIR}/usr/bin/pdf-translate" << 'EOF'
          #!/bin/sh
          if [ -x /opt/pdf-translate/pdf-translate ]; then exec /opt/pdf-translate/pdf-translate "$@"; else exec /opt/pdf-translate/app "$@"; fi
          EOF
          chmod +x "${PKGDIR}/usr/bin/pdf-translate"
          printf '%s\n' '[Desktop Entry]' 'Name=PDF Translate' 'GenericName=Leitor de PDF' 'Comment=Leitor de PDF com tradução, anotações e estatísticas' 'Exec=/usr/bin/pdf-translate %U' 'Icon=pdf-translate' 'Terminal=false' 'Type=Application' 'Categories=Office;Viewer;Education;' 'Keywords=pdf;translate;leitor;' 'StartupWMClass=dev.felipebrgs.pdftranslate' 'StartupNotify=true' 'MimeType=application/pdf;' > "${PKGDIR}/usr/share/applications/pdf-translate.desktop"
          printf '%s\n' '[Desktop Entry]' 'Name=PDF Translate' 'Exec=/usr/bin/pdf-translate %U' 'Icon=pdf-translate' 'Terminal=false' 'Type=Application' 'NoDisplay=true' 'StartupWMClass=dev.felipebrgs.pdftranslate' 'StartupNotify=true' > "${PKGDIR}/usr/share/applications/dev.felipebrgs.pdftranslate.desktop"
          if [ -f "assets/icon/app_icon.png" ]; then
            cp assets/icon/app_icon.png "${PKGDIR}/usr/share/icons/hicolor/512x512/apps/pdf-translate.png"
            cp assets/icon/app_icon.png "${PKGDIR}/usr/share/icons/hicolor/256x256/apps/pdf-translate.png"
            cp assets/icon/app_icon.png "${PKGDIR}/usr/share/pixmaps/pdf-translate.png"
          fi
          mkdir -p "${PKGDIR}/DEBIAN"
          cat > "${PKGDIR}/DEBIAN/control" << EOF
          Package: pdf-translate
          Version: ${DEB_VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: felipebrgs1 <felipebrgs1@users.noreply.github.com>
          Description: PDF Translate - Leitor de PDF com tradução, anotações e estatísticas
           App Flutter com suporte a PDF, tradução e sincronização via Cloudflare Worker.
          Depends: libgtk-3-0, libblkid1, liblzma5
          EOF
          dpkg-deb --build "${PKGDIR}" "dist/${BASENAME}.deb"
          (cd dist && sha256sum "${BASENAME}.deb" > "${BASENAME}.deb.sha256")
          ls -lh dist/

      - name: Upload artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: pdf-translate-${{ steps.version.outputs.tag }}-linux-x64
          path: dist/*
          if-no-files-found: error

      - name: Criar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Para workflow_dispatch com tag manual
      - name: Criar Release (manual)
        if: github.event.inputs.tag != '' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
